wtf:
  colors:
    border:
      focusable: darkslateblue
      focused: orange
      normal: gray
  refreshInterval: 1
  exitMessage:
    display: false
  mods:
    module11:
      title: Mastodon @pirafrank
      type: cmdrunner
      enabled: true
      position:
        top: 8
        left: 72
        width: 67
        height: 7
      args:
        - -c
        - |
          feed=$(curl -sSL https://mastodon.social/@pirafrank.rss) || exit 1
          count=$(printf '%s' "$feed" | xq -x '//item/pubDate' | wc -l)
          item=1
          while [ "$item" -le "$count" ]; do
            pub_date=$(printf '%s' "$feed" | xq -x "//item[$item]/pubDate")
            description=$(printf '%s' "$feed" | xq -x "//item[$item]/description")
            date=$(date -d "$pub_date" '+%Y-%m-%d %H:%M')
            epoch=$(date -d "$pub_date" '+%s')
            paragraph=$(printf '%s' "$description" | grep -oE '<p[^>]*>[^<]*</p>' | head -n 1 | sed -E 's#<p[^>]*>##; s#</p>##' | python3 -c 'import html, sys; print(html.unescape(sys.stdin.read()), end="")')
            if [ -n "$paragraph" ]; then
              printf '%s\t%s | %s\n' "$epoch" "$date" "$paragraph"
            fi
            item=$((item + 1))
          done | sort -nr | head -n 5 | cut -f2-
      cmd: /bin/sh
      maxLines: 5
      refreshInterval: 6h
    module1:
      title: Time
      type: clocks
      enabled: true
      position:
        top: 0
        left: 108
        width: 32
        height: 5
      colors:
        rows:
          even: lightblue
          odd: white
      locations:
        UTC: Etc/UTC
        Rome: Europe/Rome
        New York: America/New York
      refreshInterval: 15
      sort: alphabetical
    module2:
      title: fpira.com latest blog posts
      type: cmdrunner
      enabled: true
      position:
        top: 20
        left: 0
        width: 72
        height: 6
      args:
        - -c
        - curl -sSL https://fpira.com/feed.json | jq -r '.items[:5][] | "\(.date_published[0:10]) - \(.title)"'
      cmd: /bin/sh
      maxLines: 5
      refreshInterval: 12h
    module3:
      title: hackernews
      type: hackernews
      enabled: true
      position:
        top: 15
        left: 72
        width: 68
        height: 11
      numberOfStories: 10
      storyType: top
      refreshInterval: 15m
    module4:
      title: ipinfo
      type: ipinfo
      enabled: true
      position:
        top: 0
        left: 72
        width: 36
        height: 8
      colors:
        name: lightblue
        value: white
      refreshInterval: 150
    module5:
      title: uptime
      type: cmdrunner
      enabled: true
      position:
        top: 5
        left: 108
        width: 32
        height: 3
      cmd: uptime
      refreshInterval: 30
    module6:
      title: Agenda - Next Up
      type: cmdrunner
      enabled: true
      position:
        top: 8
        left: 0
        width: 72
        height: 7
      args:
        - -c
        - "ntn datasources query 'https://app.notion.com/p/pirafrank/123?v=456&source=copy_link' --limit 100 --filter '{\"property\":\"Status\",\"status\":{\"equals\":\"Next Up\"}}' --json |\n  jq -r '\n    def task_name:\n      [.properties.Name.title[]?.plain_text] | join(\"\");\n    .results[] |\n    (task_name) as $name |\n    (.properties[\"Due Date\"].date.start // \"\") as $due |\n    if $due == \"\" then $name else \"\\($due) | \\($name)\" end\n  '\n"
      cmd: /bin/sh
      maxLines: 100
      refreshInterval: 5m
    module7:
      title: Agenda - In Progress
      type: cmdrunner
      enabled: true
      position:
        top: 0
        left: 0
        width: 72
        height: 8
      args:
        - -c
        - "ntn datasources query 'https://app.notion.com/p/pirafrank/123?v=456&source=copy_link' --limit 100 --filter '{\"property\":\"Status\",\"status\":{\"equals\":\"In progress\"}}' --json |\n  jq -r '\n    def task_name:\n      [.properties.Name.title[]?.plain_text] | join(\"\");\n    .results[] |\n    (task_name) as $name |\n    (.properties[\"Due Date\"].date.start // \"\") as $due |\n    if $due == \"\" then $name else \"\\($due) | \\($name)\" end\n  '\n"
      cmd: /bin/sh
      maxLines: 100
      refreshInterval: 5m
    module8:
      title: Repos
      type: git
      enabled: true
      position:
        top: 26
        left: 0
        width: 72
        height: 15
      commitCount: 5
      commitFormat: "[forestgreen]%h [grey]%cd [white]%s [grey]%an[white]"
      dateFormat: "%H:%M %d %b %y"
      refreshInterval: 8
      lastFolderTitle: true
      branchInTitle: false
      repositories:
        - ~/poof
        - ~/vault-conductor
        - ~/rust-cli-boilerplate
        - ~/profile-avatar-maker
        - ~/jekyll-scheduler
        - ~/headroom
        - ~/notion-to-jekyll
        - ~/homebrew-tap
        - ~/aura
        - ~/pkg.fpira.com
    module9:
      title: Github
      type: github
      enabled: true
      position:
        top: 26
        left: 72
        width: 68
        height: 14
      apiKey: ~
      baseURL: ""
      customQueries:
        othersPRs:
          title: Others Pull Requests
          filter: is:open is:pr -author:wtfutil
      enableStatus: true
      refreshInterval: 300
      repositories:
        - pirafrank/poof
        - pirafrank/vault-conductor
        - pirafrank/what-size.yazi
      uploadURL: ""
      username: pirafrank
    module10:
      title: fpira.com - PED - 3 days
      type: cmdrunner
      enabled: true
      position:
        top: 15
        left: 0
        width: 72
        height: 5
      args:
        - -c
        - "today=$(date +%F)\ntomorrow=$(date -d 'tomorrow' +%F)\nin_two_days=$(date -d '+2 days' +%F)\nntn datasources query 'https://app.notion.com/p/pirafrank/444?v=555&source=copy_link' --limit 100 --sort 'Publish Date asc' --filter \"{\\\"and\\\":[{\\\"or\\\":[{\\\"property\\\":\\\"Type\\\",\\\"select\\\":{\\\"equals\\\":\\\"Blog post\\\"}},{\\\"property\\\":\\\"Type\\\",\\\"select\\\":{\\\"equals\\\":\\\"Social Post\\\"}}]},{\\\"property\\\":\\\"Publish Date\\\",\\\"date\\\":{\\\"on_or_after\\\":\\\"$today\\\"}},{\\\"property\\\":\\\"Publish Date\\\",\\\"date\\\":{\\\"on_or_before\\\":\\\"$in_two_days\\\"}}]}\" --json |\njq -r --arg today \"$today\" --arg tomorrow \"$tomorrow\" --arg in_two_days \"$in_two_days\" '\n  def title:\n    [.properties.Name.title[]?.plain_text] | join(\"\");\n  def status:\n    (.properties.Status.status.name // .properties.Status.select.name // \"\")\n    | .[0:8] as $status\n    | $status + (\"        \"[0:(8 - ($status | length))]);\n  def relative_date:\n    if . == $today then \"today\"\n    elif . == $tomorrow then \"tmrrw\"\n    elif . == $in_two_days then \"2 dys\"\n    else .\n    end;\n  .results[] |\n  (.properties[\"Publish Date\"].date.start // \"\" | .[0:10] | relative_date) as $date |\n  \"\\($date) | \\(status) | \\(title)\"\n'\n"
      cmd: /bin/sh
      maxLines: 100
      refreshInterval: 5m
