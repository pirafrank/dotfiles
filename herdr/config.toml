# Unix Herdr keybindings, following the navigation keys used in WezTerm.

[terminal]
# Keep new tabs in the current pane's working directory, like WezTerm.
new_cwd = "follow"

[keys]
reload_config = "ctrl+shift+r"

# Tabs in the current space
previous_tab = "ctrl+shift+left"
next_tab = "ctrl+shift+right"
new_tab = "ctrl+shift+t"
close_tab = "ctrl+shift+w"
rename_tab = "ctrl+shift+i"

# Agents
previous_agent = "ctrl+shift+h"
next_agent = "ctrl+shift+l"

# Spaces
previous_workspace = "ctrl+alt+left"
next_workspace = "ctrl+alt+right"
new_workspace = "ctrl+shift+n"
close_workspace = "ctrl+shift+d"
rename_workspace = "ctrl+shift+e"
